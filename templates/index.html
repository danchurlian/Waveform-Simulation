<!DOCTYPE html>

<html>
  <head>
    <title>Waveform Simulation</title>
    <!-- HTMX script right here -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" 
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" 
      integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" 
      crossorigin="anonymous"></script>

    <link href="{{ url_for('static', path='style.css') }}" rel="stylesheet" />
  </head>
  <body hx-ext="response-targets">
    <div class="page-container">
      <header>
        <h1>Waveform Simulation</h1>
        <div id="login-nav-container">
          <div id="user-label">{{ username }}</div>
          <button commandfor="login-dialog" command="show-modal">Login</button>
          <button hx-get="/api/users/logout" hx-target="#logout-message">Logout</button>
        </div>
      </header>
      <main>
        <div class="left-right-container">
          <div id="left-side">
            <div id="form-dashboard">
              <!-- Buttons -->
              <button 
                id="open-projects-dialog-button"
                hx-get="/api/projects"
                hx-target="#project-list-container"
                hx-swap="afterBegin"
                command="show-modal" 
                commandfor="load-projects-dialog">
                Load projects</button>

              <button
                id="save-project-button"
                form="signal-form"
                hx-post="/api/projects"
                hx-target="#save-result">
                Save</button>

              <div id="save-result"></div>
              <div id="logout-message"></div>
            </div>

            <!-- Form -->
            <form id="signal-form"
                  hx-post="/api/signals/graphs" 
                  hx-target="#plot-image-load" 
                  hx-swap="outerHTML"
                  hx-trigger="
                  input[event.target.matches('.freq-slider')] from:body,
                  input from:#sig-type-select,
                  submit throttle:100ms,
                  projectLoad">

              <input id="project-name-input"
                type="text"
                name="title"
                placeholder="Project Title..."
                autocomplete="off"
                required="true"
                maxlength="50"
                value="Untitled Project" />

              <select id="sig-type-select" name="sig_type">
                <option>Sine Wave</option>
                <option>Sawtooth Wave</option>
                <option>Triangle Wave</option>
                <option>Square Wave</option>
              </select>

              <div id="wave-form-item" class="wave-form-item">
                <input 
                  id="freq-text"
                  class="freq-text-field"
                  name="freq_text" 
                  type="number" 
                  autofocus="true" 
                  autocomplete="off"  
                  placeholder="Frequency (Hz)"
                  required="true"
                  value="440"
                  oninput="document.getElementById('freq-slider').value = this.value;"
                />

                <input 
                  id="freq-slider"
                  class="freq-slider"
                  name="freq_slider" 
                  type="range" 
                  min="0" 
                  max="1000" 
                  step="10"
                  value="440"
                  oninput="document.getElementById('freq-text').value = this.value;"
                />
              </div>
            </form>

            <button type="submit" form="signal-form">Submit</button>
            <button id='add-wave-button'>Add wave</button>

            <div id="error-message"></div>
            <ul id="equation-list">
            </ul>
            <div id="listen-container">
              <button id="listen-button" 
                form="signal-form"
                hx-post="/api/signals/audio"
                hx-target="#audio-output"
                hx-target-400="#audio-output"
                hx-swap="outerHTML"
                hx-trigger="click, projectLoad">
                Listen</button>
              <audio id="audio-output"></audio>
              <div id="audio-output-error"></div>
            </div>
          </div>
          <div class="centered-container" id="graph-data">
            <div id="plot-image" style="padding: 1rem"></div>
            <div id="plot-image-load" style="display:none"></div>
          </div>
        </div>


        <!-- Dialogs -->
        <dialog id="load-projects-dialog">
          <button commandfor="load-projects-dialog" command="close">Close</button>
          <h1>Load Projects</h1>

          <div id="project-list-container">
            <!-- show name, freq list, waveform string, load button -->
          </div>
        </dialog>


        <dialog id="login-dialog">
          <button commandfor="login-dialog" command="close">Close</button>
          <h1>Login </h1>
          <form id="login-form" 
                hx-post="/api/users/login"
                hx-target="#login-result">

            <div class="login-field-container">
              <label for="username">Username</label>
              <input type="text" name="username" />
            </div>

            <div class="login-field-container">
              <label for="password">Password</label>
              <input type="password" name="password" />
            </div>

            <div id="login-result"></div>

            <div id="login-button-section">
              <button type="submit" 
                name="useraction" value="login"
                >Login</button>
              <button type="submit" 
                name="useraction" value="create"
                >Create</button>
            </div>

          </form>
        </dialog>
      </main>
      <footer class="centered-container centered-vertical-container">
        Copyright (c) 2026 by Daniel Chu. All rights reserved.
      </footer>
    </div> 

    <script src="{{ url_for('static', path='/js/index.js') }}"></script>
  </body>
</html>
